name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v5
        id: bun-cache
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - run: tar --zstd -cf node_modules.tar.zst node_modules
      - uses: actions/upload-artifact@v7
        with:
          name: node-modules-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: node_modules.tar.zst

  build:
    name: Check & Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          name: node-modules-${{ github.sha }}
      - run: tar --zstd -xf node_modules.tar.zst
      # astro check is the typecheck; the build proves the site compiles.
      - run: bun run typecheck
      - run: bun run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          name: node-modules-${{ github.sha }}
      - run: tar --zstd -xf node_modules.tar.zst
      - run: bun run lint

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          name: node-modules-${{ github.sha }}
      - run: tar --zstd -xf node_modules.tar.zst
      - run: bun run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          name: node-modules-${{ github.sha }}
      - run: tar --zstd -xf node_modules.tar.zst
      - run: bun run test

  # Deploy is deliberately absent: the site is local-only. It gets added
  # explicitly at go-live, never before.
